html,body{height:100%}
body{

h1,h2,h3,.disp{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; line-height:1.15}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}

.brand{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding-top:6px}

.prow input[type=text]{min-width:0; width:100%; background:transparent; border:0; border-bottom:2px solid var(--line);

.av{font-family:var(--emoji); font-size:1.9rem; width:52px; height:52px; border-radius:12px; background:var(--panel)}
.seg{display:inline-flex; background:var(--panel); border-radius:10px; padding:3px}
.seg button{padding:7px 10px; border-radius:8px; font-size:.85rem; font-weight:700; color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink); color:var(--tile-ink)}
.iconbtn{width:38px; height:38px; border-radius:10px; font-size:1.1rem; color:var(--muted)}
.iconbtn[aria-pressed=true]{background:var(--panel); color:var(--ink)}
.prow .opts{display:flex; gap:4px; align-items:center}

.chip[aria-pressed=true]{background:var(--lila); color:var(--tile-ink); box-shadow:none}
.chip:disabled{opacity:.45; cursor:default}

.filebtn label{padding:8px 12px; border-radius:10px; background:var(--panel); font-weight:700; font-size:.9rem; cursor:pointer}
.filebtn input{position:absolute; opacity:0; width:1px; height:1px}
.notice{background:rgba(255,194,51,.12); border:1px solid rgba(255,194,51,.4); border-radius:12px; padding:10px 12px; font-size:.9rem}

.ghead{display:flex; align-items:center; gap:10px; min-height:40px}

.ghead .who b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pts{font-variant-numeric:tabular-nums; background:var(--stage-2); border-radius:999px; padding:4px 12px; font-weight:700}
.quit{margin-left:auto; padding:6px 10px; border-radius:10px; font-size:.85rem; color:var(--muted); box-shadow:inset 0 0 0 2px var(--line)}

.catname{font-size:2.3rem}
.handover .bigicon{font-size:6.5rem; animation:bob 1.6s ease-in-out infinite}
.handover h2{font-size:2.2rem}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}

/* Flaggen-Emoji-Unterstützung prüfen (Windows-PCs zeigen nur Buchstaben) */
const FLAGS_OK = (() => {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 24;
    const x = c.getContext('2d'); x.font = '20px sans-serif'; x.textBaseline = 'top'; x.fillText(flag('DE'), 0, 0);
    const d = x.getImageData(0, 0, 24, 24).data;
    for (let i = 0; i < d.length; i += 4) if (d[i+3] > 100 && d[i] > 150 && d[i+1] < 90 && d[i+2] < 90) return true;
    return false;
  } catch { return true; }
})();

/* =================== Ton & Sprache =================== */
let AC = null;
function ensureAudio(){ if (!S.sound) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch {} }
function tone(f, d = .15, type = 'sine', at = 0, vol = .14){
  if (!S.sound || !AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + at;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch {}
}
const sfx = {
  ok(){ tone(660,.12,'triangle'); tone(880,.12,'triangle',.1); tone(1320,.25,'triangle',.2); },
  no(){ tone(220,.3,'sawtooth',0,.08); tone(165,.4,'sawtooth',.18,.08); },
  tick(){ tone(1000,.05,'square',0,.05); },
  siren(){ for (let i = 0; i < 4; i++){ tone(700,.18,'square',i*.36,.07); tone(950,.18,'square',i*.36+.18,.07); } },
  fanfare(){ [523,659,784,1047].forEach((f,i) => tone(f,.3,'triangle',i*.14)); }
};
function speak(text){
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.rate = .92;
    const v = speechSynthesis.getVoices().find(v => /^de/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch {}
}
const hush = () => { try { speechSynthesis.cancel(); } catch {} };

let wake = null;
async function keepAwake(){ try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch {} }
document.addEventListener('visibilitychange', () => { if (G && document.visibilityState === 'visible') keepAwake(); });

/* =================== Fragen erzeugen =================== */
function mk(prompt, big, correct, wrong, extra = {}){
  const opts = shuffle([correct, ...wrong]);
  return Object.assign({prompt, big, opts, correct: opts.indexOf(correct)}, extra);
}
function numWrong(n){ const s = new Set(); for (const d of shuffle([-2,-1,1,2,3])) { if (n+d >= 0 && s.size < 3) s.add(String(n+d)); } return [...s]; }

// Flaggen: kein Handicap – alle bekommen denselben Pool und dieselben Fallen
function genFlag(){
  const c = pickFresh(COUNTRIES, x => 'f'+x[0]); if (!c) return null;
  const grp = LOOKALIKE.find(g => g.includes(c[0]));
  const near = grp ? shuffle(grp.filter(x => x !== c[0])).map(x => CNAME[x]) : [];
  const rest = sample(COUNTRIES.filter(x => x[0] !== c[0] && !near.includes(x[1])), 3).map(x => x[1]);
  const wrong = [...near, ...rest].slice(0, 3);
  return mk('Welches Land hat diese Flagge?', {em:flag(c[0]), cls:'flag'}, c[1], wrong);
}
function genCity(lv){
  if (lv === 2 && Math.random() < .35) {
    const s = pickFresh(STATES, x => 's'+x[0]);
    if (s) {
      const wrong = shuffle([...(s[2] ? [s[2]] : []), ...sample(STATES.filter(x => x !== s), 3).map(x => x[1])]).slice(0, 3);
      return mk(`Was ist die Landeshauptstadt von ${s[0]}?`, FLAGS_OK ? {em:flag('DE')} : {tx:'Deutschland'}, s[1], wrong);
    }
  }
  const pool = CAPITALS.filter(c => c[3] === lv);
  const c = pickFresh(pool, x => 'c'+x[0]); if (!c) return null;
  const others = (lv === 1 ? pool : CAPITALS).filter(x => x !== c).map(x => x[2]);
  const wrong = shuffle([...(c[4] ? [c[4]] : []), ...sample(others, 3)]).slice(0, 3);
  return mk(`Wie heißt die Hauptstadt von ${c[1]}?`, FLAGS_OK ? {em:flag(c[0]), cls:'flag'} : {tx:c[1]}, c[2], wrong);
}
function genK1(){
  const r = Math.random();
  if (r < .2) { const a = 2+rnd(9), b = 1+rnd(Math.min(9, 20-a)); return mk('Wie viel ist das?', {tx:`${a} + ${b} = ?`}, String(a+b), numWrong(a+b), {key:'a'+a+'+'+b}); }
  if (r < .32) { const a = 6+rnd(14), b = 1+rnd(a-1); return mk('Wie viel ist das?', {tx:`${a} − ${b} = ?`}, String(a-b), numWrong(a-b), {key:'a'+a+'-'+b}); }
  if (r < .44) { const [e, nm] = pick(COUNT_EMO), n = 3+rnd(7); return mk(`Wie viele ${nm} siehst du?`, {em:e.repeat(n), cls:'many'}, String(n), numWrong(n), {key:'n'+e+n}); }
  if (r < .52) { const s = 1+rnd(5), d = 1+rnd(3); const a = [s, s+d, '?', s+3*d]; return mk('Welche Zahl fehlt?', {tx:a.join(' · ')}, String(s+2*d), numWrong(s+2*d), {key:'z'+s+d}); }
  return genStatic('klasse1', 1);
}
function genStatic(cat, lv){
  const all = Q[cat];
  let pool = all.filter(q => q[0] === lv);
  let q = pickFresh(pool, x => cat+x[2]);
  if (!q) q = pickFresh(all, x => cat+x[2]);
  if (!q) { G.used.forEach(k => { if (k.startsWith(cat)) G.used.delete(k); }); q = pickFresh(pool.length ? pool : all, x => cat+x[2]); }
  return mk(q[2], {em:q[1]}, q[3], q.slice(4));
}
function genMemory(lv){
  const shown = sample(MEM_POOL, lv === 1 ? 4 : 6);
  const missing = pick(MEM_POOL.filter(e => !shown.includes(e)));
  return mk('Welches Bild war NICHT dabei?', null, missing, sample(shown, 3), {memorize:shown, memTime: lv === 1 ? 7 : 4, emojiOpts:true});
}
function pickFresh(pool, keyFn){
  const free = pool.filter(x => !G.used.has(keyFn(x)));
  if (!free.length) return null;
  const x = pick(free); G.used.add(keyFn(x)); return x;
}
function generate(cat, level){
  const lv = level === 'kind' ? 1 : 2;
  let q = null;
  if (cat === 'flaggen') q = genFlag();
  else if (cat === 'staedte') q = genCity(lv) || genCity(lv === 1 ? 2 : 1);
  else if (cat === 'klasse1') q = genK1();
  else if (cat === 'memory') q = genMemory(lv);
  else q = genStatic(cat, lv);
  if (!q) { G.used.clear(); return generate(cat, level); }
  return q;
}

  const rounds = quick ? 2 : S.rounds;
  G = { quick, round:0, rounds, order:shuffle(cats), pIdx:0, used:new Set(),
        scores:Object.fromEntries(S.players.map(p => [p.id, 0])), prev:{}, lukasCount:0, lukasRound:false, q:null };

function curCat(){ return G.order[G.round % G.order.length]; }
function decideLukas(){
  if (S.lukas === 'aus' && !G.quick) return false;
  if (G.quick) return G.round === 1;
  if (G.round === 0 || G.lukasCount >= 2) return false;
  if (G.lukasCount === 0 && G.round === G.rounds - 1) return true; // mindestens einmal pro Spiel

}

function question(p){
  const q = G.q, cat = q.cat;
  const limit = TIME[p.level][cat in TIME[p.level] ? cat : 'std'];
  const label = cat === 'physik'
    ? `${faceHTML('lukasmini')}<span>Lukas’ Physikfrage · ×2</span>`
    : `<span>${CATS[cat].e}</span><span>${CATS[cat].name}</span>`;
  const big = q.big ? `<div class="bigshow">${q.big.tx ? `<div class="tx">${esc(q.big.tx)}</div>` : `<div class="em ${q.big.cls||''}">${q.big.em}</div>`}</div>` : '';
  app.innerHTML = `
  <section class="screen">
    ${header(p)}
    <div class="qcat"><div class="label">${label}</div><button class="speak" data-act="speak" aria-label="Frage vorlesen">🔊</button></div>
    <div class="qtext${q.prompt.length > 80 ? ' long' : ''}">${esc(q.prompt)}</div>
    ${big}
    <div class="timer" id="tm"><i></i></div>
    <div class="tiles">
      ${q.opts.map((o,i) => `<button class="tile c${i} ${q.emojiOpts?'e':''}" data-act="answer" data-i="${i}">${q.emojiOpts?'':`<span class="sh">${SHAPES[i]}</span>`}${esc(o)}</button>`).join('')}
    </div>
  </section>`;
  if (p.read) speakQ();
  const bar = $('#tm i'), tm = $('#tm');
  const t0 = performance.now(); let lastTick = -1;
  q.limit = limit; q.t0 = t0;
  clearTimer();
  const step = now => {
    const el = (now - t0) / 1000, left = Math.max(0, limit - el);
    bar.style.transform = `scaleX(${left / limit})`;
    if (left <= 3) { tm.classList.add('low'); const s = Math.ceil(left); if (s !== lastTick && s > 0) { lastTick = s; sfx.tick(); } }
    if (left <= 0) { answer(-1); return; }
    TIMER = requestAnimationFrame(step);
  };
  TIMER = requestAnimationFrame(step);
}
function speakQ(){
  const q = G.q;
  const opts = q.emojiOpts ? '' : ' ' + q.opts.join('. Oder: ') + '.';
  const said = q.big && q.big.tx ? ' ' + q.big.tx.replace(/\+/g,' plus ').replace(/−/g,' minus ').replace(/=\s*\?/,'').replace(/·/g,', ').replace(/\?/g,'was fehlt') + '.' : '';
  speak(q.prompt + said + opts);
}

function answer(i){
  clearTimer(); hush();
  const p = S.players[G.pIdx], q = G.q;
  const el = (performance.now() - q.t0) / 1000;
  const ok = i === q.correct;
  let gain = 0;
  if (ok) { gain = Math.round(500 + 500 * Math.max(0, (q.limit - el) / q.limit)); if (q.cat === 'physik') gain *= 2; }
  G.scores[p.id] += gain;
  ok ? sfx.ok() : sfx.no();
  const last = G.pIdx === S.players.length - 1;
  const next = last ? 'Zwischenstand' : `Weiter zu ${esc(S.players[G.pIdx+1].name)}`;
  const sol = q.emojiOpts ? `<span class="em">${q.opts[q.correct]}</span>` : `<b>${esc(q.opts[q.correct])}</b>`;
  app.innerHTML = `
  <section class="screen">
    ${header(p)}
    <div class="center">
      <h2 class="verdict ${ok?'ok':'no'} pop">${ok ? 'Richtig!' : i < 0 ? 'Zeit ist um!' : 'Leider falsch'}</h2>

      ${ok ? '' : `<div class="solution">Richtig wäre: ${sol}</div>`}

function confetti(){
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), x = cv.getContext('2d');
  cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ff6b57','#2cc4b2','#ffc233','#5f8fff','#a56ff2','#fff8ef'];
  const ps = Array.from({length:140}, () => ({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.5, vx:(Math.random()-.5)*2, vy:2+Math.random()*3, r:Math.random()*6, c:pick(cols), a:Math.random()*6}));
  const t0 = performance.now();
  (function f(now){
    x.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; x.fillStyle = p.c; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillRect(-4,-2,8+p.r,4); x.restore(); });
    if (now - t0 < 4000) requestAnimationFrame(f); else { x.clearRect(0,0,cv.width,cv.height); cv.hidden = true; }
  })(t0);
}

function clearTimer(){ if (TIMER) { cancelAnimationFrame(TIMER); clearInterval(TIMER); TIMER = null; } }

    case 'admin': ADMIN = false; renderSetup(); break;
    case 'sound': S.sound = !S.sound; save(); renderSetup(); break;
    case 'nofoto': FOTO = EMBED_FOTO; store.set('3gq-foto', null); renderSetup(); break;
    case 'start': startGame(false); break;
    case 'quick': startGame(true); break;
    case 'introNext': G.lukasRound ? lukasOverlay() : handover(); break;
    case 'ready': ask(); break;
    case 'speak': speakQ(); break;
    case 'answer': answer(i); break;
    case 'next':
      if (G.pIdx < S.players.length - 1) { G.pIdx++; handover(); }
      else scoreboard(false);
      break;
    case 'nextRound':
      G.round++;
      if (G.round >= G.rounds) scoreboard(true); else roundIntro();
      break;
    case 'again': startGame(G.quick); break;
    case 'home': renderSetup(); break;
    case 'quit':
      if (quitArmed) { clearTimeout(quitArmed); quitArmed = null; renderSetup(); }
      else { b.classList.add('armed'); b.textContent = 'Wirklich beenden?'; quitArmed = setTimeout(() => { quitArmed = null; b.classList.remove('armed'); b.textContent = 'Beenden'; }, 3000); }
      break;
  }
});
app.addEventListener('input', e => {
  if (e.target.matches('input[type=text][data-i]')) { S.players[+e.target.dataset.i].name = e.target.value.trim() || 'Spieler'; save(); }
});
app.addEventListener('change', e => {
  if (e.target.id !== 'foto' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 320;
      c.getContext('2d').drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 320, 320);
      FOTO = c.toDataURL('image/jpeg', .85); store.set('3gq-foto', FOTO); renderSetup();
    };
    img.src = r.result;
  };
  r.readAsDataURL(e.target.files[0]);
});
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch {} }

const start = () => renderSetup();
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
})();
</script>
